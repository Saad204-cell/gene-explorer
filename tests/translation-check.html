<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gene Explorer: CDS translation check</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #0f1220; color: #e8ecff; padding: 16px; }
    .PASS { color: #4ade80; } .FAIL { color: #ff5d5d; } .RUN { color: #ffd43b; }
  </style>
</head>
<body>
  <h1>CDS translation check</h1>
  <p>For each gene: fetch the UniProt protein, fetch a CDS (Ensembl, then NCBI), translate the CDS,
     and require it to equal the UniProt protein exactly. Needs internet.</p>
  <pre id="out"></pre>

  <script src="../js/learn.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // Accession numbers are the UniProt entries for the human gene unless noted.
    const GENES = [
      ['INS (insulin)', 'P01308'],
      ['TP53', 'P04637'],
      ['BRCA1', 'P38398'],
      ['GFP (jellyfish, Aequorea victoria)', 'P42212'],
      ['HBB (hemoglobin beta)', 'P68871']
    ];
    const out = document.getElementById('out');
    const line = (cls, text) => out.insertAdjacentHTML('beforeend', `<span class="${cls}">${text}</span>\n`);

    (async () => {
      let failures = 0;
      for (const [name, acc] of GENES) {
        try {
          const entry = await Api.getEntry(acc);
          const r = await Api.getCds(entry);
          if (r && r.differences === 0) {
            line('PASS', `PASS ${name} ${acc}: ${r.cds.length} bp from ${r.source} ${r.id} translates to all ${entry.sequence.length} aa`);
          } else {
            failures++;
            line('FAIL', `FAIL ${name} ${acc}: ` + (r ? `best candidate (${r.source} ${r.id}) differs at ${r.differences} position(s)` : 'no CDS found'));
          }
        } catch (e) {
          failures++;
          line('FAIL', `FAIL ${name} ${acc}: ${e.message}`);
        }
      }
      line(failures ? 'FAIL' : 'PASS', failures ? `${failures} gene(s) failed` : 'All genes passed');
      document.title = failures ? 'FAILED' : 'PASSED';
    })();
  </script>
</body>
</html>
